<!DOCTYPE html>
<html>

<head>

    <title>Node.js Static Website</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background-color:#f2f2f2;
            text-align:center;
            background-color:#0d0e3b;
        }

        header{
            background-color:skyblue;
            padding:20px;
            font-size:30px;
            font-weight:bold;
        }

        .content{
            margin-top:80px;
        }

        h1{
            color:white;
        }

        p{
            font-size:20px;
            color:white;
        }

        button{
            padding:10px 20px;
            font-size:18px;
            background-color:skyblue;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        footer{
            background-color:skyblue;
            padding:15px;
            position:fixed;
            bottom:0;
            width:100%;
        }

    </style>

</head>

<body>

    <header>
        Node.js Static Website
    </header>

    <div class="content">

        <h1>Welcome to My Website</h1>

        <p>This website is served using Node.js</p>

        <button onclick="alert('Create your own content...!')">Explore</button>

    </div>

    <footer>
        SPPU WAD Assignment 3A
    </footer>

</body>

</html>
